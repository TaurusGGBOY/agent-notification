name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for manual reruns"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate release tag
        id: release
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RAW_TAG
          if ($tag -cnotmatch "^v[0-9A-Za-z][0-9A-Za-z._-]*$") {
            throw "Release tag must start with v: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows-server/go.mod
          cache-dependency-path: windows-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Run Go tests
        working-directory: windows-server
        run: go test ./... -v

      - name: Build Tauri Windows app
        working-directory: tauri-app
        run: npm run tauri:build

      - name: Build standalone server debug binaries
        working-directory: windows-server
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o agent-notify-server.exe
          $env:GOARCH = "arm64"
          go build -o agent-notify-server-arm64.exe

      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $bundleAssets = Get-ChildItem tauri-app/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" }
          if (-not $bundleAssets) {
            throw "No Tauri Windows bundle assets (.exe/.msi) were found"
          }
          $bundleAssets | Copy-Item -Destination dist-release
          Copy-Item windows-server/agent-notify-server.exe dist-release/
          Copy-Item windows-server/agent-notify-server-arm64.exe dist-release/
          Get-ChildItem dist-release | Format-Table Name,Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentnotify-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AgentNotify ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist-release/*

  macos:
    name: Build macOS release
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - name: Validate release tag
        id: release
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Release tag must start with v: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows-server/go.mod
          cache-dependency-path: windows-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Select macOS release signing mode
        id: macos-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "release_mode=signed" >> "$GITHUB_OUTPUT"
            echo "Building a Developer ID signed and notarized macOS DMG."
          else
            echo "release_mode=unsigned" >> "$GITHUB_OUTPUT"
            printf 'Missing macOS signing/notarization secrets: %s\n' "${missing[*]}"
            printf 'Building an unsigned adhoc macOS DMG. Users must right-click Open or allow it in Privacy & Security.\n'
          fi

      - name: Import Apple Developer ID certificate
        if: steps.macos-signing.outputs.release_mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-developer-id.p12"
          keychain_path="$RUNNER_TEMP/agentnotify-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          cert_id="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [ -z "$cert_id" ]; then
            echo "No Developer ID Application signing identity found in the imported certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Run Go tests
        working-directory: windows-server
        run: go test ./... -v

      - name: Build Tauri macOS app
        working-directory: tauri-app
        env:
          MACOS_RELEASE_MODE: ${{ steps.macos-signing.outputs.release_mode }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ "$MACOS_RELEASE_MODE" = "unsigned" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
          fi

          npm run tauri:build -- --bundles dmg

      - name: Verify signed and notarized DMG
        if: steps.macos-signing.outputs.release_mode == 'signed'
        run: |
          set -euo pipefail

          dmg_path="$(find tauri-app/src-tauri/target/release/bundle/dmg -type f -name "*.dmg" | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "No Tauri macOS bundle asset (.dmg) was found"
            exit 1
          fi

          hdiutil verify "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name "*.app" | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No app bundle was found inside $dmg_path"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Verify unsigned DMG
        if: steps.macos-signing.outputs.release_mode == 'unsigned'
        run: |
          set -euo pipefail

          dmg_path="$(find tauri-app/src-tauri/target/release/bundle/dmg -type f -name "*.dmg" | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "No Tauri macOS bundle asset (.dmg) was found"
            exit 1
          fi

          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name "*.app" | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No app bundle was found inside $dmg_path"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          if spctl --assess --type execute --verbose=4 "$app_path"; then
            echo "Unsigned build passed this runner's Gatekeeper assessment."
            echo "Downloaded copies may still require right-click Open because the app is not notarized."
          else
            echo "Unsigned build is expected to be rejected by Gatekeeper until the user manually allows it."
          fi

      - name: Build standalone server binaries
        working-directory: windows-server
        run: |
          GOOS=darwin GOARCH=amd64 go build -o agent-notify-server-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o agent-notify-server-darwin-arm64

      - name: Collect release assets
        env:
          MACOS_RELEASE_MODE: ${{ steps.macos-signing.outputs.release_mode }}
        run: |
          set -euo pipefail

          mkdir -p dist-release
          dmg_path="$(find tauri-app/src-tauri/target/release/bundle/dmg -type f -name "*.dmg" | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "No Tauri macOS bundle assets (.dmg) were found"
            exit 1
          fi
          dmg_name="$(basename "$dmg_path")"
          if [ "$MACOS_RELEASE_MODE" = "unsigned" ]; then
            dmg_name="${dmg_name%.dmg}-unsigned.dmg"
          fi
          cp "$dmg_path" "dist-release/$dmg_name"

          if [ -z "$(ls -A dist-release/*.dmg 2>/dev/null)" ]; then
            echo "No Tauri macOS bundle assets (.dmg) were found"
            exit 1
          fi
          cp windows-server/agent-notify-server-darwin-amd64 dist-release/
          cp windows-server/agent-notify-server-darwin-arm64 dist-release/
          if [ "$MACOS_RELEASE_MODE" = "unsigned" ]; then
            cat > dist-release/INSTALL-macOS-unsigned.txt <<'EOF'
          This macOS DMG is unsigned because this project is not currently built with
          an Apple Developer ID certificate. macOS Gatekeeper will block the first
          launch after download.

          Install:
          1. Open the DMG.
          2. Drag AgentNotify.app to Applications.
          3. In Applications, right-click AgentNotify.app and choose Open.
          4. Confirm Open in the macOS security dialog.
          5. If macOS still blocks it, open System Settings > Privacy & Security and choose Open Anyway.

          A Developer ID signed and notarized build will not need these steps.
          EOF
          fi
          shasum -a 256 dist-release/* > dist-release/SHA256SUMS.txt
          ls -la dist-release/

      - name: Delete signing keychain
        if: always() && steps.macos-signing.outputs.release_mode == 'signed'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentnotify-macos
          path: dist-release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AgentNotify ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist-release/*
