name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for manual reruns"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Validate release tag
        id: release
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RAW_TAG
          if ($tag -cnotmatch "^v[0-9A-Za-z][0-9A-Za-z._-]*$") {
            throw "Release tag must start with v: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows-server/go.mod
          cache-dependency-path: windows-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Run Go tests
        working-directory: windows-server
        run: go test ./... -v

      - name: Build Tauri Windows app
        working-directory: tauri-app
        run: npm run tauri:build

      - name: Build standalone server debug binaries
        working-directory: windows-server
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o agent-notify-server.exe
          $env:GOARCH = "arm64"
          go build -o agent-notify-server-arm64.exe

      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $bundleAssets = Get-ChildItem tauri-app/src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" }
          if (-not $bundleAssets) {
            throw "No Tauri Windows bundle assets (.exe/.msi) were found"
          }
          $bundleAssets | Copy-Item -Destination dist-release
          Copy-Item windows-server/agent-notify-server.exe dist-release/
          Copy-Item windows-server/agent-notify-server-arm64.exe dist-release/
          Get-ChildItem dist-release | Format-Table Name,Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentnotify-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: AgentNotify ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist-release/*
