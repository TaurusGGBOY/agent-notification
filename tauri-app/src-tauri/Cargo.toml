[package]
name = "agent-notify"
version = "1.0.1"
description = "AgentNotify desktop client"
authors = ["AgentNotify"]
edition = "2021"
rust-version = "1.84"

[build-dependencies]
cc = "1"
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
